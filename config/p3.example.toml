# P3 配置示例：复制为 config/p3.toml 后按需修改。
# 注意：p3.toml 含密钥，已在 .gitignore 中排除，不要提交或外传。

[server]
host = "127.0.0.1"
port = 8000

[log]
# DEBUG / INFO / WARNING / ERROR
level = "INFO"

[storage]
# 留空则使用 data/p3.db；相对路径以项目根为准
db_path = ""

[model]
# OpenAI 兼容接口
base_url = ""
api_key = ""
model = ""
# 本地演示用：true 时不联网，返回一段固定的示例回复
fake = false
# 发送给模型的历史消息条数上限
history_limit = 30

[tts]
provider = ""
base_url = ""
api_key = ""
voice = ""

[chat]
# 撤回消息时，AI 把撤回通知当作一条用户消息并回复的概率（0~1）
recall_reply_chance = 0.3
